services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Descarga los modelos una sola vez (idempotente: si ya están en el
  # volumen, ollama pull solo verifica el manifiesto) y termina — api/bot
  # no arrancan hasta que este servicio completa con éxito.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - "ollama pull nomic-embed-text && ollama pull qwen2.5:3b-instruct"

  # Ingesta la KB en Chroma. Idempotente (upsert por id de chunk), así que
  # correrla en cada `docker compose up` no duplica nada.
  ingest:
    build: .
    image: rag-faq-telegram-app:latest
    command: ["python", "-m", "src.ingest"]
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/data/chroma_data
    volumes:
      - app_data:/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  api:
    build: .
    image: rag-faq-telegram-app:latest
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/data/chroma_data
      - MEMORY_DB_PATH=/data/memory.db
    volumes:
      - app_data:/data
    depends_on:
      ollama:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

  bot:
    build: .
    image: rag-faq-telegram-app:latest
    command: ["python", "-m", "src.bot"]
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/data/chroma_data
      - MEMORY_DB_PATH=/data/memory.db
    volumes:
      - app_data:/data
    depends_on:
      ollama:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

volumes:
  ollama_data:
  app_data:
